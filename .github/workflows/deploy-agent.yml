name: Deploy chat agent

# The Biashara Bot chat agent (whatsapp-agent/) is a separate Railway service
# from the website, which deploys to GitHub Pages. Until now it was deployed by
# hand, which meant its system prompt drifted from the site: the site stopped
# claiming TRA certification months before the agent did.
#
# This deploys it whenever its source changes on main, so the two stay in step.
#
# ── Setup required before this can run ───────────────────────────────────────
# Two repository settings, both under Settings → Secrets and variables → Actions:
#
#   1. Secret  RAILWAY_TOKEN          a Railway project token with deploy rights
#                                     (Railway → project → Settings → Tokens).
#   2. Variable RAILWAY_AGENT_SERVICE the service name, as Railway shows it.
#                                     The live bot answers on
#                                     sparkling-simplicity-production-ca0b.up.railway.app,
#                                     so the service is most likely
#                                     "sparkling-simplicity" — confirm in the
#                                     Railway dashboard before relying on it.
#
# Until both are set the job fails with a message saying so, rather than
# appearing to succeed while deploying nothing.

on:
  push:
    branches: [main]
    paths:
      - 'whatsapp-agent/**'
      - '.github/workflows/deploy-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-agent
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy whatsapp-agent to Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy credentials are configured
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE: ${{ vars.RAILWAY_AGENT_SERVICE }}
        run: |
          missing=0
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Secret RAILWAY_TOKEN is not set. See the setup note at the top of this workflow."
            missing=1
          fi
          if [ -z "$SERVICE" ]; then
            echo "::error::Variable RAILWAY_AGENT_SERVICE is not set. See the setup note at the top of this workflow."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Guard the agent's own copy too: its system prompt is what the bot says
      # to customers, so an unsupported claim there is worse than one on a page.
      - name: Check marketing claims
        run: node scripts/check-claims.mjs

      - name: Build (fail before deploying, not after)
        working-directory: whatsapp-agent
        run: |
          npm ci
          npm run build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Run from whatsapp-agent/ so the upload is scoped to the agent. The
      # .railwayignore files keep .env and the stray site copies out either way.
      - name: Deploy
        working-directory: whatsapp-agent
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "${{ vars.RAILWAY_AGENT_SERVICE }}" --ci
